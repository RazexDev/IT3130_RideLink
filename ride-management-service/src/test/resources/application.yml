spring:
  data:
    mongodb:
      database: ridelink_rides_test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.4

jwt:
  secret: RideLinkSuperSecretKeyForJWTTokenGeneration2024MustBeLongEnough
  expiration: 86400000

service:
  driver-url: http://localhost:8082
  fare-url: http://localhost:8084

rabbitmq:
  exchange: ride.exchange
  routing-key:
    completed: ride.completed
