server:
  port: 8081

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ridelink_accounts}

jwt:
  secret: ${JWT_SECRET:RideLinkSuperSecretKeyForJWTTokenGeneration2024MustBeLongEnough}
  expiration: 86400000  # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
